<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #fff; }
  h1 { color: #333; }
  .tab-bar { display: flex; gap: 4px; margin-bottom: 20px; }
  .tab { padding: 8px 20px; border: 1px solid #ddd; border-radius: 6px 6px 0 0; cursor: pointer; background: #f8f8f8; }
  .tab.active { background: #fff; border-bottom: 2px solid #0066cc; font-weight: 600; }
  .diagram-container { display: none; border: 1px solid #ddd; border-radius: 0 6px 6px 6px; padding: 20px; overflow: auto; }
  .diagram-container.active { display: block; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin: 20px 0; }
  .stat-card { background: #f0f7ff; border: 1px solid #cce5ff; border-radius: 8px; padding: 16px; }
  .stat-card h3 { margin: 0 0 4px 0; font-size: 14px; color: #555; }
  .stat-card .value { font-size: 28px; font-weight: 700; color: #0066cc; }
</style>
</head>
<body>
<h1>Architecture Diagram</h1>
<div class="stats" id="stats"></div>
<div class="tab-bar">
  <div class="tab active" onclick="switchTab('code')">Code Architecture</div>
  <div class="tab" onclick="switchTab('community')">Community Clusters</div>
  <div class="tab" onclick="switchTab('files')">File Details</div>
</div>
<div id="tab-code" class="diagram-container active"><div class="mermaid" id="code-diagram"></div></div>
<div id="tab-community" class="diagram-container"><div class="mermaid" id="community-diagram"></div></div>
<div id="tab-files" class="diagram-container">
  <table style="width:100%;border-collapse:collapse;">
    <thead><tr style="background:#f0f0f0;"><th>File</th><th>Functions</th><th>Calls</th><th>Type</th><th>Community</th></tr></thead>
    <tbody id="file-tbody"></tbody>
  </table>
</div>
<script>
function sid(name) { return 'n' + name.replace(/[^a-zA-Z0-9]/g, '_').replace(/^_+|_+$/g, '').slice(0, 40) || 'x'; }
function shortName(path) { return path.replace(/^.*\//, ''); }

let arch = null;

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.diagram-container').forEach(d => d.classList.remove('active'));
  document.querySelector(`.tab:nth-child(${name === 'code' ? 1 : name === 'community' ? 2 : 3})`).classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
}

function render() {
  document.getElementById('stats').innerHTML = [
    { label: 'Total Nodes', value: arch.meta?.totalNodes },
    { label: 'Total Edges', value: arch.meta?.totalEdges },
    { label: 'Source Files', value: arch.meta?.totalFiles },
    { label: 'Code Files', value: arch.files?.length },
    { label: 'Communities', value: arch.meta?.totalCommunities },
    { label: 'Call Edges', value: arch.callGraph?.totalCallEdges },
  ].map(s => `<div class="stat-card"><h3>${s.label}</h3><div class="value">${s.value}</div></div>`).join('');

  // Code architecture (JS + Bash only)
  const codeFiles = (arch.files || []).filter(f => f.file.endsWith('.js') || f.file.endsWith('.sh'));
  const jsFiles = codeFiles.filter(f => f.file.endsWith('.js'));
  const shFiles = codeFiles.filter(f => f.file.endsWith('.sh'));

  let cm = 'graph TB\n';
  // Frontend subgraph
  cm += '  subgraph FE["Frontend (JavaScript)"]\n';
  jsFiles.forEach((f, i) => {
    const id = 'fe' + i;
    const label = shortName(f.file) + ' (' + f.functionCount + 'f, ' + f.callCount + 'c)';
    cm += '    ' + id + '["' + label + '"]\n';
  });
  cm += '  end\n';
  // Backend subgraph
  cm += '  subgraph BE["Backend (Bash)"]\n';
  shFiles.forEach((f, i) => {
    const id = 'be' + i;
    const label = shortName(f.file) + ' (' + f.functionCount + 'f, ' + f.callCount + 'c)';
    cm += '    ' + id + '["' + label + '"]\n';
  });
  cm += '  end\n';
  // Cross-file edges with sanitized IDs
  const fileToId = {};
  jsFiles.forEach((f, i) => { fileToId[f.file] = 'fe' + i; });
  shFiles.forEach((f, i) => { fileToId[f.file] = 'be' + i; });
  arch.files?.forEach(f => {
    (f.dependsOn || []).forEach(d => {
      if (fileToId[f.file] && fileToId[d.file] && f.file !== d.file) {
        cm += '  ' + fileToId[f.file] + ' -->|' + d.callCount + '| ' + fileToId[d.file] + '\n';
      }
    });
  });
  document.getElementById('code-diagram').textContent = cm;

  // Community diagram
  let commM = 'graph TB\n';
  (arch.services || []).slice(0, 8).forEach((s, i) => {
    const cid = 'c' + i;
    commM += '  subgraph ' + cid + '["Community ' + s.community + ' (' + s.nodeCount + 'n, ' + s.fileCount + 'f)"]\n';
    (s.files || []).slice(0, 5).forEach(f => {
      const nid = cid + '_' + sid(f);
      const label = shortName(f);
      const extra = f.length > 50 ? '...' : '';
      commM += '    ' + nid + '["' + extra + label + '"]\n';
    });
    if (s.files.length > 5) {
      commM += '    ' + cid + '_more["... +' + (s.files.length - 5) + ' more"]\n';
    }
    commM += '  end\n';
  });
  document.getElementById('community-diagram').textContent = commM;

  // File table
  const tbody = document.getElementById('file-tbody');
  (arch.topFiles || []).slice(0, 50).forEach(f => {
    const ext = f.file.includes('.') ? f.file.split('.').pop() : 'sh';
    const m = { js: 'JS', sh: 'Bash', json: 'JSON', php: 'PHP', md: 'Doc' };
    const tr = document.createElement('tr');
    tr.innerHTML = '<td style="padding:6px 12px;border-bottom:1px solid #eee;">' + f.file + '</td>' +
      '<td style="padding:6px 12px;border-bottom:1px solid #eee;">' + f.functions + '</td>' +
      '<td style="padding:6px 12px;border-bottom:1px solid #eee;">' + f.calls + '</td>' +
      '<td style="padding:6px 12px;border-bottom:1px solid #eee;">' + (m[ext] || ext) + '</td>' +
      '<td style="padding:6px 12px;border-bottom:1px solid #eee;">' + f.community + '</td>';
    tbody.appendChild(tr);
  });

  mermaid.run({ querySelector: '.mermaid' });
}
</script>

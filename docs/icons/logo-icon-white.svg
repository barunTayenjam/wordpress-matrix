<svg fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="SiteMatrix"><title>SiteMatrix</title>
  
  <!-- Simplified small-size cut: three flat faces, no internal detail.
       The traced master collapses to mush at 16 px, so the icon is redrawn
       as a bare isometric cube - the idea survives, the detail does not. -->
  <style>
    @media (prefers-color-scheme: dark){
      [fill="#ffffff"]{fill:#ffffff}
      [fill="#ffffff"]{fill:#ffffff}
      [fill="#ffffff"]{fill:#ffffff}
    }
  </style>
  <g id="icon">
    <!-- top face -->
    <polygon fill="#ffffff" points="128,26 234,86 128,146 22,86"/>
    <!-- left face -->
    <polygon fill="#ffffff" points="22,86 128,146 128,244 22,184"/>
    <!-- right face -->
    <polygon fill="#ffffff" points="234,86 128,146 128,244 234,184"/>
  </g>
</svg>
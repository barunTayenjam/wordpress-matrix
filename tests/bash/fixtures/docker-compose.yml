version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: wp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: wp
      MYSQL_USER: ${MYSQL_USER:-wp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wp_password}
    volumes:
      - db-data:/var/lib/mysql
      - ./config/docker/my.cnf:/etc/mysql/conf.d/matrix.cnf:ro
    networks:
      - wp-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wp_redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - wp-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: wp_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER:-wp_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-wp_password}
    ports:
      - "8200:80"
    networks:
      - wp-net
    depends_on:
      - db

  # WordPress site: alpha
  wp_alpha:
    image: wordpress:php8.3-fpm
    container_name: wp_alpha
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wp_password}
      WORDPRESS_DB_NAME: alpha_db
      WORDPRESS_DEBUG: ${WP_DEBUG:-true}
    volumes:
      - ./wp_alpha:/var/www/html
    networks:
      - wp-net
    depends_on:
      db:
        condition: service_healthy

  nginx_alpha:
    image: nginx:alpine
    container_name: nginx_alpha
    restart: unless-stopped
    ports:
      - "8201:80"
    volumes:
      - ./config/nginx/alpha.conf:/etc/nginx/conf.d/default.conf:ro
      - ./wp_alpha:/var/www/html:ro
    networks:
      - wp-net
    depends_on:
      - wp_alpha

  # WordPress site: beta (Apache — .htaccess parity with production)
  wp_beta:
    build:
      context: ./config/docker/wp-apache
      args:
        PHP_VERSION: 8.1
    image: wp-matrix-apache:8.1
    container_name: wp_beta
    restart: unless-stopped
    ports:
      - "8202:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wp_password}
      WORDPRESS_DB_NAME: beta_db
      WORDPRESS_DEBUG: ${WP_DEBUG:-true}
    volumes:
      - ./wp_beta:/var/www/html
    networks:
      - wp-net
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 3g
    cpus: 1.0

networks:
  wp-net:
    driver: bridge

volumes:
  db-data:
  redis-data:
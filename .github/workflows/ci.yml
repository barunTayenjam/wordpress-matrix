name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Shell syntax
        run: |
          bash -n matrix
          for s in scripts/*.sh; do bash -n "$s"; done

      - name: Offline bash suites (stubbed, no Docker)
        run: |
          fails=0
          for t in tests/bash/*-test.sh; do
            bash "$t" || { echo "FAILED: $t"; fails=1; }
          done
          exit $fails

      - name: Frontend Jest
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test

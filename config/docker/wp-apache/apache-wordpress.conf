<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # HTTP/2 cleartext — works on localhost with Chrome/Lighthouse (h2c).
    # For production over HTTPS the TLS VHost handles h2 automatically.
    Protocols h2c http/1.1
    H2Direct on

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP-FPM via Unix socket (local matrix). Production uses the same pattern in .htaccess.
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    Protocols h2 http/1.1
    H2Direct on

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/su26.crt
    SSLCertificateKeyFile /etc/apache2/ssl/su26.key

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Long-cache static assets (Lighthouse: serve cached assets)
    <FilesMatch "\.(css|js|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|ico)$">
        Header set Cache-Control "max-age=31536000, public, immutable"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
